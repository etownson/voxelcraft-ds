<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g transform="rotate(-45 32 32)">
    <!-- struts to the panels -->
    <rect x="12" y="30.5" width="40" height="3" fill="#8a96a3"/>
    <!-- left solar panel -->
    <g>
      <rect x="1" y="21" width="15" height="22" rx="1.5" fill="#2f6fd6" stroke="#1b3f80" stroke-width="1.5"/>
      <path d="M8.5 21v22M1 28.3h15M1 35.7h15" stroke="#9cc4ff" stroke-width="1.2"/>
    </g>
    <!-- right solar panel -->
    <g>
      <rect x="48" y="21" width="15" height="22" rx="1.5" fill="#2f6fd6" stroke="#1b3f80" stroke-width="1.5"/>
      <path d="M55.5 21v22M48 28.3h15M48 35.7h15" stroke="#9cc4ff" stroke-width="1.2"/>
    </g>
    <!-- body -->
    <rect x="22" y="23" width="20" height="18" rx="3" fill="#d9dee4" stroke="#5b6672" stroke-width="1.5"/>
    <rect x="25" y="26" width="14" height="5" rx="1" fill="#f2c84b"/>
    <!-- antenna mast and dish -->
    <rect x="30.75" y="15" width="2.5" height="8" fill="#5b6672"/>
    <path d="M22 15 Q32 3 42 15 Z" fill="#eef1f4" stroke="#5b6672" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="32" cy="9" r="1.8" fill="#e04a3a"/>
  </g>
</svg>
